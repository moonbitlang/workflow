name: publish-package

on:
  workflow_dispatch:

jobs:
  publish-workflow:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      # Nightly, like the CI gate: the module's wildcard constructor patterns
      # do not build on stable, so a stable prepublish check would fail every
      # release.
      - name: install moon (nightly)
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s nightly
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: post install
        run: |
          moon version --all
          moon update

      - name: prepublish check
        run: |
          moon check --target native --deny-warn
          moon test --target native

      - name: publish
        env:
          SECRET: ${{ secrets.MOONCAKES_MOONBITLANG_TOKEN }}
        shell: bash
        run: |
          if [ -z "$SECRET" ]; then
            echo "Error: MOONCAKES_MOONBITLANG_TOKEN secret is not set."
            echo "Please contact an admin to grant access to this secret."
            exit 1
          fi
          echo "$SECRET" > ~/.moon/credentials.json
          moon publish
          rm ~/.moon/credentials.json
